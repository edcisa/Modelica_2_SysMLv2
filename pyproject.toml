[tool.poetry]
name = "modelica2sysmlv2"
version = "0.1.0"
description = "AI-assisted semantic transformation pipeline from Modelica to SysML v2"
authors = ["Your Name <your.email@domain.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/your-org/Modelica2Sysmlv2"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.6.4"
typer = "^0.12.3"
loguru = "^0.7.2"
openpyxl = "^3.1.2"
pandas = "^2.2.2"
matplotlib = "^3.8.4"
networkx = "^3.3"
ruff = "^0.4.2"
black = "^24.4.2"
mypy = "^1.10.0"
pytest = "^8.2.0"
python-dotenv = "^1.0.1"
langchain = "^0.1.17"
tree-sitter = "^0.20.4"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
ruff = "^0.4.2"
black = "^24.4.2"
mypy = "^1.10.0"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
